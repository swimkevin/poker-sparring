# wrangler.toml — Cloudflare Workers config for the poker relay.
# Deploy from the repo root:  cd worker && npx wrangler deploy
# (or `npx wrangler deploy -c worker/wrangler.toml` from the repo root)

name = "poker-sparring-relay"
main = "index.js"
compatibility_date = "2026-10-01"

# One Durable Object instance per room code (idFromName). Free tier includes
# Durable Objects; see worker/README.md for limits.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
